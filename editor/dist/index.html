or:var(--text);font-weight:500}.empty p{max-width:520px}.graph{position:absolute;inset:0;background-image:radial-gradient(#1a1a30 1px,transparent 1px);background-size:24px 24px;cursor:grab}.graph-hint{position:absolute;left:16px;right:16px;bottom:12px;color:var(--muted);font-size:12px;pointer-events:none}.node{cursor:pointer}.node rect:first-child{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.node:hover rect:first-child{stroke:var(--gold-dim)}.node.selected rect:first-child{stroke:var(--gold);fill:#1a1508}.node-title{fill:var(--text);font-size:13px;font-weight:600}.node-sub{fill:var(--muted);font-size:11px}.handle{fill:var(--bg);stroke:var(--gold-dim);stroke-width:2;cursor:crosshair}.handle:hover{fill:var(--gold)}.edge{fill:none;stroke:var(--gold-dim);stroke-width:2}.edge.dashed{stroke-dasharray:6 5}.edge.linking{stroke:var(--gold);pointer-events:none}.edge-grab{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}.edge-grab:hover{stroke:#c0564f59}.edge-label{fill:var(--muted);font-size:11px;pointer-events:none}.inspector-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:16px 0 14px;background:var(--panel);border-bottom:1px solid var(--line)}.inspector-head>div{flex:1;min-width:0}.kind{color:var(--gold);font-size:12px;letter-spacing:.08em;text-transform:uppercase}.id{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:13px}.section{padding:18px 0 6px;border-bottom:1px solid var(--line)}.section h3{margin:0 0 12px;font-size:15px;font-weight:600}h4{margin:16px 0 8px;font-size:13px;color:var(--muted);font-weight:600}.field{margin-bottom:14px}.field>label{display:block;margin-bottom:5px;color:var(--muted);font-size:13px}.required{color:var(--gold)}.help{margin:5px 0 8px;color:var(--muted);font-size:12px}.row{display:flex;gap:8px;align-items:center}.check{display:flex;gap:8px;align-items:center;cursor:pointer}.check input{width:18px;height:18px;accent-color:var(--gold)}.item,.nested{margin:8px 0;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px}.nested{background:transparent}.item-tools{display:flex;justify-content:flex-end;gap:6px;margin-top:4px}.item-tools button{padding:3px 10px;font-size:12px}.typed>.row{margin-bottom:12px}details.phase{padding:4px 0}aside details>summary{text-transform:none;letter-spacing:0;font-size:14px}.suggest{position:relative;flex:1}.suggest-list{position:absolute;z-index:5;left:0;right:0;top:100%;max-height:240px;overflow-y:auto;background:var(--raised);border-radius:6px;box-shadow:0 8px 24px #0009}.suggest-item{padding:6px 10px;font-size:13px;cursor:pointer}.suggest-item:hover{background:var(--gold-dim)}.problems-head{position:sticky;top:0;display:flex;gap:14px;align-items:baseline;padding:10px 18px;background:var(--panel)}.problem{display:flex;gap:14px;padding:7px 18px;font-size:13px;border-top:1px solid var(--line);cursor:pointer}.problem:hover{background:var(--raised)}.problem .sev{width:62px;flex:none;text-transform:uppercase;font-size:11px;padding-top:2px}.problem.error .sev{color:var(--danger)}.problem.warning .sev{color:var(--gold)}.problem.ok{color:var(--ok);cursor:default}.problem .where{color:var(--muted);flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media (max-width: 1100px){#app{grid-template-columns:220px minmax(0,1fr) 360px}}</style>
