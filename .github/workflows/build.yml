name: Build Solace

on:
  push:
    branches:
      - undergarden-ru-integration
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Download compile-only mod jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs

          download_modrinth() {
            local slug="$1"
            local output="$2"
            local loaders_json="$3"

            echo "Resolving ${slug}..."
            local encoded_loaders
            encoded_loaders=$(python3 - <<PY
import urllib.parse
print(urllib.parse.quote('''${loaders_json}'''))
PY
)
            local encoded_versions
            encoded_versions=$(python3 - <<'PY'
import urllib.parse
print(urllib.parse.quote('["1.20.1"]'))
PY
)

            local api="https://api.modrinth.com/v2/project/${slug}/version?game_versions=${encoded_versions}&loaders=${encoded_loaders}"
            local url
            url=$(python3 - <<PY
import json, urllib.request, sys
api = '''${api}'''
with urllib.request.urlopen(api) as response:
    versions = json.load(response)
if not versions:
    raise SystemExit(f'No Modrinth versions found for {api}')
version = versions[0]
files = version.get('files', [])
primary = next((f for f in files if f.get('primary')), files[0] if files else None)
if primary is None:
    raise SystemExit(f'No files found for {api}')
print(primary['url'])
PY
)
            echo "Downloading ${url} -> libs/${output}"
            curl -L --fail --retry 3 --output "libs/${output}" "${url}"
          }

          # MineCells is a Fabric mod used through Sinytra Connector in the pack.
          download_modrinth "minecells" "minecells.jar" '["fabric"]'

          # The Undergarden is the Forge dimension mod whose generator Solace patches.
          download_modrinth "the-undergarden" "undergarden.jar" '["forge"]'

          echo "Downloaded compile-only jars:"
          ls -lh libs

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: solace-jars
          path: build/libs/*.jar
          if-no-files-found: error
