plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0'
group = 'com.solace'

base {
    archivesName = 'solace'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
    maven {
        url "https://cursemaven.com"
    }

    maven {
        url 'https://maven.kyrptonaught.dev'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("curse.maven:custom-portal-api-forge-621463:4704980")

    compileOnly files('../mods/minecells-1.9.2.jar')
    compileOnly files('../mods/justtrialspawners-1.20.1-1.3.0.jar')
    compileOnly files('../mods/The_Undergarden-1.20.1-0.8.14.jar')
    compileOnly files('../mods/breezy-1.20.1-1.2.2.jar')
    compileOnly files('../mods/difficulty_enhancement-0.1.jar')
    compileOnly files('../mods/terrain_slabs-forge-3.1.1.jar')
    compileOnly files('../mods/sodiumoptionsmodcompat-forge-1.0.0-1.20.1.jar')
    compileOnly files('../mods/modernworldcreation_forge_2.0.2_MC_1.20.1.jar')
    compileOnly files('../mods/cherishedworlds-forge-6.1.7+1.20.1.jar')
    def embeddiumCompileJar = file('../mods/embeddium-PHASE2-e3ec533.jar')
    compileOnly files(embeddiumCompileJar.exists() ? embeddiumCompileJar : file('../mods/embeddium-PHASE2-e3ec533.jar.disabled'))
    compileOnly files('../mods/elixirum-forge-1.20.1-0.12.1.jar')
    compileOnly files('../mods/irons_spellbooks-1.20.1-3.15.2.jar')
    compileOnly files('../mods/fragmentum-5.3.0+1.20.1-forge.jar')
    compileOnly files('../mods/kotlinforforge-4.11.0-all.jar')
    compileOnly files('../mods/archivist-forge-1.20.1-1.1.12.jar')
    compileOnly files('../mods/obscure_api-18.jar')
    compileOnly files('../mods/Jade-1.20.1-Forge-11.13.3.jar')
    compileOnly files('../mods/jei-1.20.1-forge-15.56.0.205.jar')
    compileOnly files('../mods/emi-1.1.24+1.20.1+forge.jar')
    compileOnly files('../mods/mcde-1.6.4-1.20.jar')
    compileOnly files('../mods/caverns_and_chasms-1.20.1-2.1.3.jar')
    compileOnly files('../mods/betterarcheology-1.2.1-1.20.1.jar')
    compileOnly files('../mods/goety-2.5.43.1.jar')
    compileOnly files('../mods/nyfsspiders-forge-1.20.1-2.1.2.jar')
    compileOnly files('../mods/iter_rpg-0.7.8-forge-1.20.1.jar')
    compileOnly files('../mods/friendsandfoes-forge-mc1.20.1-3.0.8.jar')
    compileOnly files('../mods/immersive_melodies-0.8.2-1.20.1-forge.jar')
    compileOnly files('../mods/alexsmobs-1.22.9.jar')
    compileOnly files('../mods/incontrol-1.20-9.4.1.jar')
    compileOnly files('../mods/witherstormmod-1.20.1-4.2.1-all.jar')
    compileOnly files('../mods/Ad-Astra-Giselle-Addon-forge-1.20.1-6.18.jar')
    compileOnly files('../mods/vminus-3.3.1.jar')
    compileOnly files('../mods/relics-1.20.1-0.8.0.7.jar')
    compileOnly files('../mods/sophisticatedbackpacks-1.20.1-3.26.3.2157.jar')
    compileOnly files('../mods/sophisticatedcore-1.20.1-1.5.1.2327.jar')
    compileOnly files('../mods/curios-forge-5.14.1+1.20.1.jar')
    compileOnly files('../mods/fancymenu_forge_3.9.6_MC_1.20.1.jar')
    compileOnly files('../mods/Dungeon Now Loading-forge-1.20.1-2.2.jar')
    compileOnly files('../mods/lootr-forge-1.20-0.7.35.94.jar')
    compileOnly files('../mods/gliders-forge-1.1.6.jar')
    compileOnly files('../mods/moremobvariants-forge+1.20.1-1.3.0.1.jar')
    compileOnly files('../mods/ImmediatelyFast-Forge-1.5.5+1.20.4.jar')
    // Solace Quests optional integrations
    compileOnly files('../mods/thief-1.20.1-1.2.2-forge.jar')
    compileOnly files('../mods/xaerominimap-forge-1.20.1-26.6.0.jar')
    compileOnly files('../mods/fancytoasts-1.5.1-forge-1.20.1.jar')
    compileOnly files('../mods/kubejs-forge-2001.6.5-build.16.jar')
    compileOnly files('../mods/rhino-forge-2001.2.3-build.10.jar')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1'))
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.4.1')) {
        jarJar.ranged(it, '[0.4.1,)')
    }
}

mixin {
    add sourceSets.main, 'solace.refmap.json'
    config 'solace.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    // The quest web editor, built by "npm run build" in editor/ and committed as one file.
    from('editor/dist') {
        include 'index.html'
        into 'assets/solace/quest_editor'
    }
    from('editor/standalone') {
        into 'assets/solace/quest_editor'
    }

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'solace.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

// The distributable contains the method-wrapper runtime as a Forge Jar-in-Jar library.
tasks.named('jarJar').configure {
    archiveClassifier = ''
    manifest.from(tasks.named('jar').get().manifest)
    finalizedBy 'reobfJarJar'
}
reobf { jarJar {} }
tasks.named('build').configure { dependsOn tasks.named('jarJar') }

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.named('test', Test).configure { useJUnitPlatform() }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Standalone library checks. This never runs a Minecraft client, server, or GameTest process.
def compileNoiseHashChecks = tasks.register('compileNoiseHashChecks', JavaCompile) {
    dependsOn tasks.named('classes')
    source = fileTree('tools/noise-hash') { include '*.java' }
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = layout.buildDirectory.dir('noise-hash/checks')
    options.compilerArgs += ['-proc:none']
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.register('verifyNoiseHashMemo', JavaExec) {
    dependsOn compileNoiseHashChecks
    classpath = files(compileNoiseHashChecks.flatMap { it.destinationDirectory }) + sourceSets.main.runtimeClasspath
    workingDir = layout.buildDirectory.dir('noise-hash').get().asFile
    mainClass = 'VerifyNoiseHashMemo'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.named('check').configure { dependsOn tasks.named('verifyNoiseHashMemo') }

def compileFeatureCycleChecks = tasks.register('compileFeatureCycleChecks', JavaCompile) {
    dependsOn tasks.named('classes')
    source = fileTree('tools/feature-cycle') { include '*.java' }
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = layout.buildDirectory.dir('feature-cycle/checks')
    options.compilerArgs += ['-proc:none']
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.register('verifyFeatureCycleResolver', JavaExec) {
    dependsOn compileFeatureCycleChecks
    classpath = files(compileFeatureCycleChecks.flatMap { it.destinationDirectory }) + sourceSets.main.runtimeClasspath
    workingDir = layout.buildDirectory.dir('feature-cycle').get().asFile
    mainClass = 'VerifyFeatureCycleResolver'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.named('check').configure { dependsOn tasks.named('verifyFeatureCycleResolver') }

[
        Default: [json: '{}', enabled: true],
        Disabled: [json: '{"featureCycleResolver":false}', enabled: false],
        GlobalDisabled: [json: '{"enabled":false}', enabled: false],
        Dedicated: [json: '{"singleplayerOnly":true,"featureCycleResolver":true}', enabled: true],
        PropertyDisabled: [json: '{}', enabled: false, property: 'solace.commonPerformance.featureCycleResolver'],
        CommonDisabled: [json: '{}', enabled: false, property: 'solace.commonPerformance']
].each { name, fixture ->
    def gate = tasks.register("verifyFeatureCycleGate${name}", JavaExec) {
        dependsOn compileFeatureCycleChecks
        classpath = files(compileFeatureCycleChecks.flatMap { it.destinationDirectory }) + sourceSets.main.runtimeClasspath
        workingDir = layout.buildDirectory.dir("feature-cycle/gate-${name}").get().asFile
        doFirst { workingDir.mkdirs() }
        mainClass = 'VerifyFeatureCycleResolver'
        args '--config', fixture.json.bytes.encodeBase64().toString(), fixture.enabled.toString()
        if (fixture.property) systemProperty fixture.property, 'false'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    }
    tasks.named('check').configure { dependsOn gate }
}

tasks.register('verifyFeatureCycleArtifact', JavaExec) {
    dependsOn compileFeatureCycleChecks, tasks.named('reobfJarJar')
    classpath = files(compileFeatureCycleChecks.flatMap { it.destinationDirectory }) + sourceSets.main.runtimeClasspath
    workingDir = layout.buildDirectory.dir('feature-cycle').get().asFile
    mainClass = 'VerifyFeatureCycleArtifact'
    args tasks.named('jarJar').get().archiveFile.get().asFile.absolutePath
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
tasks.named('check').configure { dependsOn tasks.named('verifyFeatureCycleArtifact') }
// sync tick
