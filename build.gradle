plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0'
group = 'com.solace'

base {
    archivesName = 'solace'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    maven {
        url "https://cursemaven.com"
    }

    maven {
        url 'https://maven.kyrptonaught.dev'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("curse.maven:custom-portal-api-forge-621463:4704980")

    compileOnly files('../mods/minecells-1.9.2.jar')
    compileOnly files('../mods/The_Undergarden-1.20.1-0.8.14.jar')
    compileOnly files('../mods/RegionsUnexploredForge-0.5.6+1.20.1.jar')
    compileOnly files('../mods/breezy-1.20.1-1.2.2.jar')
    compileOnly files('../mods/difficulty_enhancement-0.1.jar')
    compileOnly files('../mods/modernworldcreation_forge_2.0.2_MC_1.20.1.jar')
    compileOnly files('../mods/elixirum-forge-1.20.1-0.12.0.jar')
    compileOnly files('../mods/irons_spellbooks-1.20.1-3.15.2.jar')
    compileOnly files('../mods/fragmentum-forge-1.20.1-1.2.3.jar')
    compileOnly files('../mods/archivist-forge-1.20.1-1.1.12.jar')
    compileOnly files('../mods/obscure_api-18.jar')
    compileOnly files('../mods/Jade-1.20.1-Forge-11.12.3.jar')
    compileOnly files('../mods/jei-1.20.1-forge-15.20.0.112.jar')
    compileOnly files('../mods/emi-1.1.22+1.20.1+forge.jar')
    compileOnly files('../mods/mcde-1.6.4-1.20.jar')
    compileOnly files('../mods/caverns_and_chasms-1.20.1-2.1.2.jar')
    compileOnly files('../mods/goety-2.5.43.1.jar')
    compileOnly files('../mods/nyfsspiders-forge-1.20.1-2.1.2.jar')
    compileOnly files('../mods/iter_rpg-0.7.8-forge-1.20.1.jar')
    compileOnly files('../mods/friendsandfoes-forge-mc1.20.1-3.0.8.jar')
    compileOnly files('../mods/immersive_melodies-0.3.0+1.20.1-forge.jar')
    compileOnly files('../mods/alexsmobs-1.22.9.jar')

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'solace.refmap.json'
    config 'solace.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'solace.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
// sync tick
